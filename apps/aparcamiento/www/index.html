<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b3048">
<title>Aparcamiento Imposible</title>
<link rel="stylesheet" href="shared/core.css">
<style>
  :root { --bg: #2b3048; }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(env(safe-area-inset-bottom) + 14px);
    display: flex; justify-content: center; gap: 12px; z-index: 5; }
  .boost { display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 700; gap: 2px; }
  .boost .icon-btn { width: 58px; height: 58px; font-size: 28px; background: #3d4466; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .boost.active .icon-btn { background: #f5a623; }
  #level { font-size: 20px; }
  .hearts { letter-spacing: 2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <button class="icon-btn" id="btnSet">⚙️</button>
  <div class="pill" id="level">Nivel 1</div>
  <div class="pill"><span class="hearts" id="hearts">❤️❤️❤️</span></div>
  <div class="pill">🪙 <span id="coins">0</span></div>
</div>
<div class="bottom">
  <div class="boost" id="bTow"><button class="icon-btn">🛻</button><span id="tTow">Grúa</span></div>
  <div class="boost" id="bRestart"><button class="icon-btn">🔄</button><span id="tRestart">Reiniciar</span></div>
</div>
<script src="shared/core.js"></script>
<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
