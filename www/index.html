<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05030f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Éxodo 2942</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Pantalla de título -->
  <section id="title" class="screen show">
    <div class="logo">
      <div class="logo-top">ÉXODO</div>
      <div class="logo-num">2942</div>
      <div class="tagline">Una familia. Un universo que no les deja ir.</div>
    </div>
    <div class="menu">
      <button id="btnPlay" class="btn primary">NUEVA PARTIDA</button>
      <button id="btnChapters" class="btn">CAPÍTULOS</button>
      <button id="btnSound" class="btn small">SONIDO: SÍ</button>
    </div>
    <div class="hiscore" id="hiscore"></div>
  </section>

  <!-- Selector de capítulos -->
  <section id="chapters" class="screen">
    <h2>CAPÍTULOS</h2>
    <div id="chapterList" class="chapter-list"></div>
    <button id="btnBack" class="btn small">VOLVER</button>
  </section>

  <!-- Diapositivas de historia (prólogo / epílogo) -->
  <section id="story" class="screen">
    <div class="story-card">
      <div class="story-title" id="storyTitle"></div>
      <div class="story-text" id="storyText"></div>
      <div class="hint">Toca para continuar</div>
    </div>
    <button class="skip" id="storySkip">SALTAR ▸▸</button>
  </section>

  <!-- Tarjeta de capítulo -->
  <section id="card" class="screen">
    <div class="card-num" id="cardNum"></div>
    <div class="card-title" id="cardTitle"></div>
    <div class="card-place" id="cardPlace"></div>
  </section>

  <!-- Diálogo con retrato -->
  <section id="dialog" class="overlay">
    <div class="dlg-box">
      <div class="portrait" id="dlgPortrait"><span></span></div>
      <div class="dlg-body">
        <div class="dlg-name" id="dlgName"></div>
        <div class="dlg-role" id="dlgRole"></div>
        <div class="dlg-text" id="dlgText"></div>
      </div>
    </div>
    <button class="skip" id="dlgSkip">SALTAR ▸▸</button>
  </section>

  <!-- Radio durante el vuelo -->
  <div id="comm" class="comm">
    <div class="portrait mini" id="commPortrait"><span></span></div>
    <div><div class="comm-name" id="commName"></div><div class="comm-text" id="commText"></div></div>
  </div>

  <!-- Controles táctiles -->
  <div id="controls" class="controls">
    <button id="btnBomb" class="ctl bomb"><span class="ctl-label">PULSO</span><span class="ctl-count" id="bombCount">3</span></button>
    <button id="btnPhase" class="ctl phase"><svg viewBox="0 0 100 100"><circle id="phaseRing" cx="50" cy="50" r="44"/></svg><span class="ctl-label">FASE</span></button>
    <button id="btnPause" class="pause">II</button>
  </div>

  <!-- Pausa -->
  <section id="pause" class="screen dim">
    <h2>PAUSA</h2>
    <div class="menu">
      <button id="btnResume" class="btn primary">CONTINUAR</button>
      <button id="btnSound2" class="btn small">SONIDO: SÍ</button>
      <button id="btnQuit" class="btn small">SALIR AL MENÚ</button>
    </div>
    <div class="help">Arrastra en cualquier parte para pilotar · FASE: intangibilidad · PULSO: limpia la pantalla<br>Teclado: flechas/WASD · Z fase · X pulso · P pausa</div>
  </section>

  <!-- Fin de partida -->
  <section id="gameover" class="screen dim">
    <h2 class="red">EL ESPERANZA HA CAÍDO</h2>
    <p class="go-quote" id="goQuote"></p>
    <div class="menu">
      <button id="btnRetry" class="btn primary">REINTENTAR CAPÍTULO</button>
      <button id="btnMenu" class="btn small">MENÚ</button>
    </div>
  </section>

  <div id="rotate" class="rotate">Gira el dispositivo en vertical</div>

  <script src="js/story.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/backgrounds.js"></script>
  <script src="js/bosses.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
