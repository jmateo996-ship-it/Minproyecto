<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:360px;height:640px;overflow:hidden;background:#000;color:#fff;font-family:'Inter','Segoe UI',system-ui,sans-serif}
#stage{position:absolute;inset:0}
.txt{position:absolute;left:0;right:0;text-align:center;padding:0 22px}
.eye{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%)}
.ordo{color:#ff3b5c;font-weight:900;letter-spacing:.12em;font-size:21px;text-shadow:0 0 18px #ff2a4f}
.fam{position:absolute;top:150px;left:0;right:0;display:flex;justify-content:center;gap:12px}
.p{width:70px;text-align:center;transition:none}
.c{width:66px;height:66px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:30px;border:2px solid #fff6;
  background:radial-gradient(circle at 35% 30%,#fff3,#0008 70%),var(--pc);box-shadow:0 0 18px var(--pc)}
.n{font-size:11px;font-weight:800;letter-spacing:.12em}
.l1{font-size:20px;font-weight:700;line-height:1.4}
.l2{font-size:26px;font-weight:900;color:#ffe066;text-shadow:0 0 18px #ffe066}
.logo1{font-size:72px;font-weight:900;letter-spacing:.14em;background:linear-gradient(180deg,#fff 10%,#8fe6ff 55%,#2a7dff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #4fd8ffaa)}
.logo2{font-size:46px;font-weight:300;letter-spacing:.5em;margin-left:.5em;color:#ffb347;text-shadow:0 0 18px #ffb347aa}
.tag{font-size:15px;opacity:.9;margin-top:16px}
.cta{display:inline-block;margin-top:26px;padding:10px 18px;border:1.5px solid #9fefff;border-radius:6px;font-size:13px;font-weight:800;letter-spacing:.18em;background:linear-gradient(90deg,#4fd8ff40,#c46bff40)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ff2a4f22 1px,transparent 1px),linear-gradient(90deg,#ff2a4f22 1px,transparent 1px);background-size:24px 24px}
</style></head>
<body><div id="stage"></div>
<script>
const P = Object.fromEntries(new URLSearchParams(location.search.slice(1)));
const S = document.getElementById('stage');
const ease = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
const clamp = x => Math.max(0, Math.min(1, x));
const FAM = [['D', '#4fd8ff', P.n1], ['L', '#ffb347', P.n2], ['N', '#9dff6a', P.n3], ['T', '#ffe066', P.n4]];
window.render = t => {
  if (P.mode === 'eye') {
    const open = ease((t - 0.5) / 1.0), r = 90;
    const glow = 0.4 + 0.6 * open;
    S.innerHTML = `<div class="grid" style="opacity:${0.25 * open}"></div>
      <svg class="eye" width="260" height="260" viewBox="-130 -130 260 260">
        <defs><radialGradient id="g"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#ff6a8a"/><stop offset=".6" stop-color="#7a0a2a"/><stop offset="1" stop-color="#14020a"/></radialGradient>
        <clipPath id="lid"><ellipse cx="0" cy="0" rx="${r + 10}" ry="${Math.max(0.5, (r + 10) * open)}"/></clipPath></defs>
        <circle r="${r + 26}" fill="none" stroke="#c46bff" stroke-opacity="${0.6 * open}" stroke-width="3" stroke-dasharray="40 14" transform="rotate(${t * 40})"/>
        <g clip-path="url(#lid)"><circle r="${r}" fill="url(#g)" style="filter:drop-shadow(0 0 ${30 * glow}px #ff2a4f)"/>
        <ellipse cx="${Math.sin(t * 2) * 8}" cy="0" rx="12" ry="28" fill="#050005"/></g>
        <line x1="-${r + 12}" x2="${r + 12}" y1="0" y2="0" stroke="#ff2a4f" stroke-width="${2 * (1 - open)}" opacity="${1 - open}"/>
      </svg>
      <div class="txt ordo" style="top:470px;opacity:${clamp((t - 1.3) / 0.5)};transform:translateX(${(Math.sin(t * 50) > 0.92 ? 3 : 0)}px)">${P.t1}</div>`;
  } else if (P.mode === 'family') {
    const mapped = clamp((t - 2.4) / 0.4);
    S.innerHTML = `<div class="fam">${FAM.map(([i, c, n], k) => {
      const a = ease((t - k * 0.3) / 0.5), teo = k === 3;
      const dim = teo ? 1 : 1 - 0.65 * mapped;
      return `<div class="p" style="opacity:${a * dim};transform:translateY(${(1 - a) * 20}px) scale(${teo ? 1 + 0.15 * mapped : 1})">
        <div class="c" style="--pc:${c};${!teo && mapped ? `outline:2px solid rgba(255,42,79,${mapped});outline-offset:4px` : ''}">${i}</div><div class="n" style="color:${c}">${n}</div></div>`;
    }).join('')}</div>
      <div class="txt l1" style="top:330px;opacity:${clamp((t - 1.3) / 0.5)}">${P.t1}</div>
      <div class="txt l2" style="top:400px;opacity:${clamp((t - 2.5) / 0.4)}">${P.t2}</div>`;
  } else if (P.mode === 'logo') {
    const a = ease(t / 0.7);
    S.innerHTML = `<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#2a1458,#05030f 70%)"></div>
      <div class="txt" style="top:190px;opacity:${a};transform:scale(${0.9 + 0.1 * a})"><div class="logo1" style="font-size:${P.t1.length > 5 ? 58 : 72}px">${P.t1}</div><div class="logo2">2942</div></div>
      <div class="txt tag" style="top:360px;opacity:${clamp((t - 0.6) / 0.5)}">${P.t2}</div>
      <div class="txt" style="top:410px;opacity:${clamp((t - 1.2) / 0.5)}"><span class="cta">${P.t3}</span></div>`;
  }
};
render(0);
</script></body></html>
