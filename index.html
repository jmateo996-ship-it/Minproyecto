<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Protocolo Ceniza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Saira+Stencil+One&family=Special+Elite&display=swap">
<style>
/* Concepto: terminal táctico frío sobre un mundo oscuro; ámbar para la información, rojo solo para el peligro. */
:root{
  --ink:#04070b; --steel:#0d141c; --panel:rgba(9,14,20,.82); --line:rgba(160,190,215,.18);
  --text:#d9e2ea; --dim:#8494a3; --amber:#f0b44c; --amber-d:#9a6a1c; --red:#ff3b30; --ok:#69e0a0; --spore:#ff8a2a;
  --f-title:'Saira Stencil One','Impact','Arial Narrow',sans-serif;
  --f-ui:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-doc:'Special Elite','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:none}
.layer{position:fixed;inset:0;pointer-events:none}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;box-sizing:border-box}
.screen.dim{background:radial-gradient(ellipse at center,rgba(4,7,11,.55),rgba(4,7,11,.94))}
button{font-family:var(--f-ui);cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ---------- título ---------- */
#title{flex-direction:column;align-items:flex-start;justify-content:flex-end;padding-bottom:9vh;
  background:linear-gradient(90deg,rgba(4,7,11,.92) 0%,rgba(4,7,11,.55) 45%,rgba(4,7,11,0) 75%)}
#title .wrap{width:min(560px,100%);margin-left:clamp(0px,6vw,90px)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.32em;color:var(--amber);text-transform:uppercase}
#title h1{font-family:var(--f-title);font-weight:400;font-size:clamp(54px,10vw,118px);line-height:.86;margin:14px 0 6px;letter-spacing:.01em;color:#eef3f7;
  text-shadow:0 0 40px rgba(255,138,42,.18)}
#title h1 span{display:block;color:var(--spore);text-shadow:0 0 28px rgba(255,138,42,.55)}
#title .tag{font-family:var(--f-mono);font-size:13px;color:var(--dim);max-width:46ch;line-height:1.6;margin:14px 0 30px}
.menu{display:flex;flex-direction:column;gap:6px;align-items:stretch;width:min(340px,100%)}
.menu button{background:transparent;border:0;border-left:2px solid var(--line);color:var(--text);text-align:left;padding:10px 16px;font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:all .15s}
.menu button:hover,.menu button:focus-visible{border-left-color:var(--amber);color:var(--amber);background:linear-gradient(90deg,rgba(240,180,76,.12),transparent);padding-left:22px;outline:none}
.menu button small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:none;margin-top:2px}
.menu button[disabled]{opacity:.35;pointer-events:none}
#title .foot{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;font-family:var(--f-mono);font-size:11px;color:var(--dim);letter-spacing:.1em}

/* ---------- panel genérico ---------- */
.card{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);width:min(860px,100%);max-height:100%;overflow:auto;box-sizing:border-box;padding:28px clamp(18px,4vw,40px);position:relative}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--amber)}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.card h2{font-family:var(--f-title);font-weight:400;font-size:clamp(34px,6vw,56px);margin:4px 0 2px;line-height:1;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-mono);font-size:12px;color:var(--dim);letter-spacing:.06em;margin-bottom:18px}
.meta b{color:var(--text);font-weight:500}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{background:var(--amber);color:#1a1206;border:0;padding:12px 22px;font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--amber);color:var(--amber)}

/* ---------- radio ---------- */
.radio{display:flex;flex-direction:column;gap:10px;min-height:120px}
.line{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start;animation:in .25s ease-out}
.line .av{width:64px;height:64px;border:1px solid var(--line);background:#0a1118;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--f-title);font-size:26px}
.line .av canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.line .who{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;margin-bottom:3px}
.line .who i{font-style:normal;color:var(--dim);letter-spacing:.06em;margin-left:8px}
.line .txt{font-family:var(--f-mono);font-size:15px;line-height:1.55;color:var(--text);min-width:0}
.hint{font-family:var(--f-mono);font-size:11px;color:var(--dim);letter-spacing:.1em;margin-top:8px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.objs{margin:18px 0 0;padding:14px 16px;border:1px dashed var(--line);font-size:15px}
.objs div{display:flex;gap:10px;padding:3px 0}
.objs div::before{content:"▸";color:var(--amber)}
.prose{font-family:var(--f-mono);font-size:15px;line-height:1.75;max-width:64ch}
.prose p{margin:0 0 14px;animation:in .6s ease-out both}

/* ---------- HUD ---------- */
#hud{display:none}
#hud.on{display:block}
.hud-tl{position:fixed;left:max(18px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;width:min(330px,60vw)}
.mtitle{font-family:var(--f-mono);font-size:11px;letter-spacing:.24em;color:var(--amber);text-transform:uppercase}
.objective{font-size:15px;font-weight:500;line-height:1.35;text-shadow:0 1px 3px #000;display:flex;gap:8px}
.objective::before{content:"";flex:0 0 8px;height:8px;margin-top:6px;border:2px solid var(--amber);transform:rotate(45deg)}
.timer{font-family:var(--f-mono);font-size:22px;color:var(--red);text-shadow:0 0 12px rgba(255,59,48,.5);font-variant-numeric:tabular-nums}
.hud-bl{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;width:min(300px,55vw)}
.lifelbl{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--dim)}
.life{height:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);position:relative;overflow:hidden}
.life i{position:absolute;inset:0;background:linear-gradient(90deg,#3fb27f,#7ff0b4);transform-origin:left;transition:transform .2s}
.life.low i{background:linear-gradient(90deg,#b0201a,#ff5a4a);animation:pulse 0.8s infinite}
@keyframes pulse{50%{opacity:.55}}
.inv{display:flex;gap:14px;font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.inv b{color:var(--text);font-weight:500}
.hud-br{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:right}
.wname{font-size:13px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.ammo{font-family:var(--f-ui);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.ammo small{font-size:18px;color:var(--dim);font-weight:500}
.hud-tr{position:fixed;right:max(18px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#radar{width:176px;height:176px;border:1px solid var(--line);background:rgba(5,12,16,.7);border-radius:50%}
.status{font-family:var(--f-mono);font-size:12px;letter-spacing:.24em;padding:3px 10px;border:1px solid var(--line);color:var(--ok)}
.status.alert{color:#fff;background:var(--red);border-color:var(--red);animation:pulse .5s infinite}
.status.evade{color:#1a1206;background:var(--amber);border-color:var(--amber)}
.status.caution{color:var(--amber);border-color:var(--amber)}
.bossbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(18px + env(safe-area-inset-top,0px));width:min(520px,70vw);text-align:center}
.bossbar .life i{background:linear-gradient(90deg,#9c3a10,#ff8a2a)}
.bossbar .lifelbl{justify-content:center;color:var(--spore);margin-bottom:4px}
#subs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(720px,calc(100% - 32px));display:flex;flex-direction:column;gap:6px}
#subs .line{background:var(--panel);border:1px solid var(--line);padding:10px;grid-template-columns:44px 1fr}
#subs .line .av{width:44px;height:44px;font-size:18px}
#subs .line .txt{font-size:14px}
.tag3d{position:fixed;transform:translate(-50%,-100%);font-family:var(--f-ui);font-weight:700;pointer-events:none;text-shadow:0 0 8px #000;white-space:nowrap}
.tag3d.q{color:var(--amber);font-size:26px}
.tag3d.x{color:var(--red);font-size:34px}
.tag3d.p{font-size:13px;font-weight:600;letter-spacing:.06em;background:rgba(4,7,11,.75);border:1px solid var(--amber-d);padding:4px 8px;color:var(--text)}
.tag3d.p em{color:var(--amber);font-style:normal}
.prog{height:3px;background:rgba(255,255,255,.15);margin-top:4px}
.prog i{display:block;height:100%;background:var(--amber)}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-family:var(--f-title);font-size:clamp(24px,4vw,40px);letter-spacing:.06em;color:var(--amber);text-shadow:0 0 20px rgba(240,180,76,.4);opacity:0;transition:opacity .4s;text-align:center}
#toast.on{opacity:1}
#cursor{position:fixed;width:28px;height:28px;margin:-14px 0 0 -14px;pointer-events:none;z-index:50}

/* ---------- documento ---------- */
.doc{background:#d9d2c0;color:#24201a;width:min(620px,100%);max-height:100%;overflow:auto;box-sizing:border-box;padding:34px clamp(20px,5vw,46px);box-shadow:0 30px 80px rgba(0,0,0,.7);transform:rotate(-.6deg);
  background-image:radial-gradient(ellipse at 20% 10%,rgba(120,90,40,.15),transparent 50%),radial-gradient(ellipse at 90% 90%,rgba(90,60,20,.22),transparent 45%)}
.doc h3{font-family:var(--f-doc);font-weight:400;font-size:22px;margin:0 0 16px;border-bottom:1px solid rgba(0,0,0,.25);padding-bottom:10px}
.doc pre{font-family:var(--f-doc);font-size:15.5px;line-height:1.65;white-space:pre-wrap;margin:0}
.doc .btn{margin-top:22px}

/* ---------- debrief ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:16px 0}
.stats div{background:#0a1018;padding:12px 14px}
.stats span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.stats b{font-size:24px;font-variant-numeric:tabular-nums}
.rank{display:flex;align-items:center;gap:18px;margin:6px 0 4px}
.rank .r{font-family:var(--f-title);font-size:84px;line-height:1;color:var(--amber);text-shadow:0 0 30px rgba(240,180,76,.35)}
.rank .n{font-family:var(--f-mono);font-size:13px;letter-spacing:.2em;color:var(--dim)}
.rank .n b{display:block;font-family:var(--f-ui);font-size:22px;color:var(--text);letter-spacing:.08em}
.grid20{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.grid20 button{background:#0a1018;border:1px solid var(--line);color:var(--text);text-align:left;padding:10px 12px;font-size:14px}
.grid20 button span{display:block;font-family:var(--f-mono);font-size:10px;color:var(--dim);letter-spacing:.14em}
.grid20 button:hover{border-color:var(--amber)}
.grid20 button[disabled]{opacity:.3;pointer-events:none}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:15px;margin-top:10px}
.keys kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);padding:3px 8px;background:#0a1018;color:var(--amber);white-space:nowrap;justify-self:start}
.red{color:var(--red)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink);font-family:var(--f-mono);letter-spacing:.3em;color:var(--dim);font-size:12px;z-index:100}

/* ---------- táctil ---------- */
#touch{display:none}
#touch.on{display:block}
.stick{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);pointer-events:auto;touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(240,180,76,.3);border:1px solid var(--amber)}
#stickL{left:max(24px,env(safe-area-inset-left,0px))}
#stickR{right:max(24px,env(safe-area-inset-right,0px))}
.tbtns{position:fixed;right:max(170px,calc(env(safe-area-inset-right,0px) + 170px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,52px);gap:8px;pointer-events:auto}
.tbtns button{width:52px;height:44px;background:rgba(9,14,20,.7);border:1px solid var(--line);color:var(--text);font-size:11px;font-weight:600;touch-action:none}
#touch.on ~ #hud .hud-br{bottom:calc(180px + env(safe-area-inset-bottom,0px))}
@media (max-width:640px){
  #radar{width:120px;height:120px}
  .ammo{font-size:32px}
  .line{grid-template-columns:44px 1fr}.line .av{width:44px;height:44px;font-size:18px}
  .line .txt{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script type="module">

  'Hace 72 horas, el complejo dejó de transmitir. Seis horas después llegó una única señal de socorro, cifrada con una clave que solo conoce un hombre: el Dr. Aurel Novak.',

const MISSIONS = [
// ---------------------------------------------------------------------------
{ id: 1, title: 'Desembarco', place: 'Playa norte · Perímetro exterior', time: 'Día 1 · 01:40',

  intro: [

    ['IBA', 'Repaso rápido. Halden contrató al Grupo Varek para la seguridad del complejo. Unos ochenta hombres, ex militares. No son tus enemigos oficialmente, pero no saben que estás aquí, y prefiero que siga así.'],
    ['IBA', 'Objetivo: entrar en Thule-7, encontrar al Dr. Novak y averiguar qué se ha escapado de ese laboratorio. Si es lo que creemos, lo destruyes.'],
    ['MAR', 'Agente, soy la Dra. Ilse Maren. Trabajé para Halden hasta hace dos años. Lleve la máscara de filtro puesta en todo momento. Si en el aire hay esporas, no las verá hasta que sea tarde.'],
    ['IBA', 'Controles de sigilo: agáchate para moverte en silencio, apaga la linterna si quieres pasar desapercibida, y si te ven… rompe la línea de visión y espera. La escotilla del muelle está al este.'],

function tileNoise(size, seed) {

// ---------------------------------------------------------------- mapa ----
function genMap(M) {
  const W = M.w, H = M.h, R = rng(M.seed);
  const g = new Uint8Array(W * H).fill(1);
  const rooms = [];
  const at = (x, y) => g[y * W + x];
  const carve = (x, y) => { if (x > 0 && y > 0 && x < W - 1 && y < H - 1 && g[y * W + x] === 1) g[y * W + x] = 0; };
  if (M.layout === 'rooms') {
    let tries = 0;
    while (rooms.length < 13 && tries < 900) {
      tries++;
      const w = 4 + (R() * 6 | 0), h = 4 + (R() * 4 | 0), x = 1 + (R() * (W - w - 2) | 0), y = 1 + (R() * (H - h - 2) | 0);
      if (rooms.some(r => x < r.x + r.w + 2 && x + w + 2 > r.x && y < r.y + r.h + 2 && y + h + 2 > r.y)) continue;
      rooms.push({ x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) });
    }
    rooms.forEach(r => { for (let j = r.y; j < r.y + r.h; j++) for (let i = r.x; i < r.x + r.w; i++) g[j * W + i] = 0; });
    const inTree = [0], edges = [];
    while (inTree.length < rooms.length) {
      let best = null;
      for (const a of inTree) for (let b = 0; b < rooms.length; b++) {
        if (inTree.includes(b)) continue;
        const d = Math.abs(rooms[a].cx - rooms[b].cx) + Math.abs(rooms[a].cy - rooms[b].cy);
        if (!best || d < best.d) best = { a, b, d };
      }
      inTree.push(best.b); edges.push([best.a, best.b]);
    }
    for (let k = 0; k < 3; k++) { const a = R() * rooms.length | 0, b = R() * rooms.length | 0; if (a !== b) edges.push([a, b]); }
    edges.forEach(([a, b]) => {
      const A = rooms[a], B = rooms[b], wide = R() < 0.35;
      let x = A.cx, y = A.cy; const hFirst = R() < 0.5;
      const stepTo = (tx, ty) => { while (x !== tx || y !== ty) { if (x !== tx) x += Math.sign(tx - x); else y += Math.sign(ty - y); carve(x, y); if (wide) { carve(x + 1, y); carve(x, y + 1); } } };
      if (hFirst) { stepTo(B.cx, y); stepTo(B.cx, B.cy); } else { stepTo(x, B.cy); stepTo(B.cx, B.cy); }
    });
  } else if (M.layout === 'open') {
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) g[y * W + x] = 0;
    // edificios macizos
    const nb = 6 + (R() * 3 | 0);
    for (let b = 0; b < nb; b++) {
      const w = 3 + (R() * 5 | 0), h = 3 + (R() * 4 | 0), x = 3 + (R() * (W - w - 6) | 0), y = 3 + (R() * (H - h - 6) | 0);
      if (x < 9 && y > H / 2 - 6 && y < H / 2 + 6) continue; // zona de inicio libre
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) g[j * W + i] = 1;
    }
    // bordes irregulares
    for (let x = 1; x < W - 1; x++) { const d1 = R() < 0.4 ? 1 : 0, d2 = R() < 0.4 ? 1 : 0; for (let k = 0; k < d1; k++) g[(1 + k) * W + x] = 1; for (let k = 0; k < d2; k++) g[(H - 2 - k) * W + x] = 1; }
    // zonas (para colocar cosas)
    const zx = 4, zy = 3;
    for (let a = 0; a < zx; a++) for (let b = 0; b < zy; b++) {
      const x0 = 1 + (a * (W - 2) / zx | 0), y0 = 1 + (b * (H - 2) / zy | 0), w = ((W - 2) / zx | 0), h = ((H - 2) / zy | 0);
      rooms.push({ x: x0, y: y0, w, h, cx: x0 + (w >> 1), cy: y0 + (h >> 1), open: true });
    }
  } else { // arena
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) g[y * W + x] = 0;
    for (let y = 4; y < H - 4; y += 6) for (let x = 4; x < W - 4; x += 7) {
      if (Math.abs(x - W / 2) < 4 && Math.abs(y - H / 2) < 4) continue;
      g[y * W + x] = 1; g[y * W + x + 1] = 1; g[(y + 1) * W + x] = 1; g[(y + 1) * W + x + 1] = 1;
    }
    rooms.push({ x: 1, y: 1, w: W - 2, h: H - 2, cx: W >> 1, cy: H >> 1, arena: true });
  }
  const map = { W, H, g, rooms, R, props: [] };
  // inicio = sala más a la izquierda
  let startRoom = rooms.reduce((b, r) => (r.cx < b.cx ? r : b), rooms[0]);
  if (M.layout === 'arena') startRoom = rooms[0];
  map.startRoom = startRoom;
  let sx = startRoom.cx, sy = startRoom.cy;
  if (M.layout === 'open') { sx = 3; sy = H >> 1; for (let j = sy - 2; j <= sy + 2; j++) for (let i = 1; i <= 6; i++) g[j * W + i] = 0; }
  if (M.layout === 'arena') { sx = W >> 1; sy = H - 4; }
  map.start = { x: sx, y: sy };
  // asegurar conectividad: celdas libres no alcanzables -> muro
  const dist = bfsField(map, sx, sy);
  for (let i = 0; i < W * H; i++) if (g[i] === 0 && dist[i] < 0) g[i] = 1;
  map.dist = dist;
  rooms.forEach(r => { r.d = dist[r.cy * W + r.cx]; if (r.d < 0) { // centro bloqueado: buscar celda libre
    let best = -1; for (let j = r.y; j < r.y + r.h; j++) for (let i = r.x; i < r.x + r.w; i++) if (dist[j * W + i] >= 0 && (best < 0 || Math.abs(i - r.cx) + Math.abs(j - r.cy) < best)) { best = Math.abs(i - r.cx) + Math.abs(j - r.cy); r.cx = i; r.cy = j; }
    r.d = dist[r.cy * W + r.cx]; } });
  map.rooms = rooms.filter(r => r.d >= 0);
  return map;
}

function bfsField(map, sx, sy, passable = (v) => v === 0) {
  const { W, H, g } = map, dist = new Int16Array(W * H).fill(-1), q = new Int32Array(W * H);
  let h = 0, t = 0; const s = sy * W + sx; if (!passable(g[s])) return dist;
  dist[s] = 0; q[t++] = s;
  while (h < t) {
    const c = q[h++], x = c % W, y = (c / W) | 0, d = dist[c] + 1;
    if (x > 0 && dist[c - 1] < 0 && passable(g[c - 1])) { dist[c - 1] = d; q[t++] = c - 1; }
    if (x < W - 1 && dist[c + 1] < 0 && passable(g[c + 1])) { dist[c + 1] = d; q[t++] = c + 1; }
    if (y > 0 && dist[c - W] < 0 && passable(g[c - W])) { dist[c - W] = d; q[t++] = c - W; }
    if (y < H - 1 && dist[c + W] < 0 && passable(g[c + W])) { dist[c + W] = d; q[t++] = c + W; }
  }
  return dist;
}

// Ruta en celdas desde (sx,sy) a (tx,ty) usando el campo de distancias inverso
function findPath(map, sx, sy, tx, ty) {
  const f = bfsField(map, tx, ty);
  const W = map.W; let c = sy * W + sx; if (f[c] < 0) return null;

    if (!ok) { map.g[key(i, j)] = 0; return false; }
    occ.add(key(i, j)); return true;
  };

  // ---- salida (posición calculada antes de los muros)
  occ.add(key(ex[0], ex[1]));
  for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) occ.add(key(ex[0] + di, ex[1] + dj));
  const exc = cellCenter(ex[0], ex[1]);
  level.exit = { x: exc.x, z: exc.z, mesh: makeExitMarker() };
  level.exit.mesh.position.set(exc.x, 0, exc.z); G.add(level.exit.mesh);

  // ---- objetivos
  const midRooms = roomsByDist.filter(r => r !== exitRoom && r !== map.startRoom);
  const pickRooms = (n, from = 0.25) => { const pool = midRooms.length ? midRooms : roomsByDist; const out = []; for (let k = 0; k < n; k++) { const t = from + (1 - from) * ((k + 0.5) / n); out.push(pool[Math.min(pool.length - 1, Math.floor(t * pool.length))]); } return out; };
  M.objectives.forEach((ob, stage) => {
    if (ob.type === 'collect') {
      pickRooms(ob.count, 0.3 + stage * 0.05).forEach(room => {
        const c = freeCell(room, { minStart: 6 }) || freeCell(room); if (!c) return; occ.add(key(c[0], c[1]));
        level.pickups.push({ type: ob.item, stage, ...cellCenter(c[0], c[1]) });
      });
    } else if (ob.type === 'interact' || ob.type === 'plant') {
      const rooms = M.layout === 'arena' ? [roomsByDist[0]] : pickRooms(ob.count, 0.35 + stage * 0.1);
      rooms.forEach(room => {
        let c = null;
        for (let t = 0; t < 30 && !c; t++) { const cc = freeCell(room, { interior: true, minStart: 5 }); if (cc && placeSolid(cc[0], cc[1])) c = cc; }
        if (!c) for (let t = 0; t < 30 && !c; t++) { const cc = freeCell(room, {}); if (cc && placeSolid(cc[0], cc[1])) c = cc; }
        if (!c) return;
        const p = cellCenter(c[0], c[1]), mesh = makeTarget(ob.target);
        mesh.position.set(p.x, 0, p.z); mesh.rotation.y = (R() * 4 | 0) * Math.PI / 2; G.add(mesh);
        level.targets.push({ type: ob.target, stage, x: p.x, z: p.z, mesh, done: false, plant: ob.type === 'plant', progress: 0 });
        level.lamps.push({ x: p.x, y: 1.8, z: p.z, color: mesh.userData.light, power: 10, flick: 0, small: true });
      });
    }
  });
  // ---- documentos
  (M.docs || []).forEach((doc, k) => {
    const room = pickRooms(1, 0.15 + k * 0.2)[0] || roomsByDist[0]; const c = freeCell(room) || [map.start.x + 1, map.start.y];
    occ.add(key(c[0], c[1])); level.pickups.push({ type: 'doc', doc, ...cellCenter(c[0], c[1]) });
  });
  // ---- suministros
  const nRooms = map.rooms.length;
  const supply = (type, n) => { for (let k = 0; k < n; k++) { const room = map.rooms[R() * nRooms | 0]; const c = freeCell(room); if (c) { occ.add(key(c[0], c[1])); level.pickups.push({ type, ...cellCenter(c[0], c[1]) }); } } };
  const hostile = M.infected + M.runners + M.brutes * 3 + M.guards;
  supply('ammo', 2 + Math.round(hostile / 4));
  if (M.id >= 4) supply('shells', 1 + Math.round((M.infected + M.brutes * 3) / 6));
  supply('medkit', 1 + Math.round(hostile / 7));

  // ---- obstáculos/decorado
  map.rooms.forEach(room => {
    if (room.arena) return;
    const n = room.open ? 3 + (R() * 4 | 0) : Math.max(1, (room.w * room.h / 9) | 0);
    for (let k = 0; k < n; k++) {
      const c = freeCell(room, { interior: !room.open, minStart: 3 }); if (!c) continue;
      if (!placeSolid(c[0], c[1])) continue;
      const type = th.props[R() * th.props.length | 0];
      const p = cellCenter(c[0], c[1]), prop = makeProp(type, R);
      prop.position.set(p.x, 0, p.z); G.add(prop);
      if (prop.userData.glow) level.lamps.push({ x: p.x, y: 1.5, z: p.z, color: prop.userData.glow, power: 6, flick: 0, small: true });
    }
  });
  // decorado no sólido: tuberías en el techo, cables, charcos de sangre seca
  const decoMat = new THREE.MeshStandardMaterial({ map: bloodTex(), transparent: true, depthWrite: false, roughness: 0.3, opacity: 0.8 });
  for (let k = 0; k < (th.outdoor ? 4 : 14); k++) {
    const room = map.rooms[R() * nRooms | 0], c = freeCell(room); if (!c) continue; const p = cellCenter(c[0], c[1]);
    const d = new THREE.Mesh(new THREE.PlaneGeometry(1.6 + R() * 2, 1.6 + R() * 2), decoMat); d.rotation.x = -Math.PI / 2; d.rotation.z = R() * 6; d.position.set(p.x + (R() - .5), 0.015, p.z + (R() - .5)); d.receiveShadow = true; G.add(d);
  }

  // ---- lámparas
  const poolTex = radialTex('rgba(255,255,255,0.9)', 'rgba(255,255,255,0)');
  const addLamp = (x, z, col, power = 1, flick = 0) => {
    level.lamps.push({ x, y: th.outdoor ? 4.2 : th.wallH - 0.25, z, color: col, power: 26 * power, flick });
    if (th.outdoor) { const pole = cyl(0.08, 0.1, 4.4, mats().dark, x, 2.2, z, 8); G.add(pole); const hd = box(0.6, 0.15, 0.3, mats().dark, x, 4.35, z); G.add(hd); const em = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.04, 0.24), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(4) })); em.position.set(x, 4.26, z); G.add(em); }
    else { const fx = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.22), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(3) })); fx.position.set(x, th.wallH - 0.05, z); G.add(fx); }
    const pool = new THREE.Mesh(new THREE.PlaneGeometry(7, 7), new THREE.MeshBasicMaterial({ map: poolTex, color: new THREE.Color(col).multiplyScalar(0.12 * power), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    pool.rotation.x = -Math.PI / 2; pool.position.set(x, 0.03, z); G.add(pool);
    level.lamps[level.lamps.length - 1].pool = pool;
  };
  map.rooms.forEach(room => {
    if (room.arena) { for (let a = 0; a < 3; a++) for (let b = 0; b < 2; b++) { const p = cellCenter(room.x + 3 + a * ((room.w - 6) / 2 | 0), room.y + 3 + b * (room.h - 6)); addLamp(p.x, p.z, th.lamp, 1.2, th.flicker ? 0.3 : 0); } return; }
    if (room.open) { if (R() < 0.75) { const c = freeCell(room) || [room.cx, room.cy]; const p = cellCenter(c[0], c[1]); addLamp(p.x, p.z, th.lamp, 1.1, 0); } return; }
    if (R() < 0.12 && room !== map.startRoom) return; // algunas salas a oscuras
    const p = cellCenter(room.cx, room.cy); const fl = th.flicker && R() < th.flicker ? 1 : 0;
    addLamp(p.x, p.z, th.lamp, 1, fl);
    if (room.w * room.h > 40) { const p2 = cellCenter(room.x + 1, room.y + 1); addLamp(p2.x + 1, p2.z + 1, th.lamp, 0.7, 0); }
  });
  // lámpara de salida
  level.lamps.push({ x: exc.x, y: 2.5, z: exc.z, color: 0x50ff9a, power: 12, flick: 0, exit: true });

  // ---- fuego (misión final)
  if (th.fires) {
    for (let k = 0; k < 16; k++) { const room = map.rooms[R() * nRooms | 0], c = freeCell(room, { minStart: 4 }); if (!c) continue; const p = cellCenter(c[0], c[1]); const f = makeFire(); f.position.set(p.x, 0, p.z); G.add(f); level.fires.push(f); level.lamps.push({ x: p.x, y: 1.2, z: p.z, color: 0xff6a20, power: 22, flick: 2, fire: true }); occ.add(key(c[0], c[1])); }
  }

  // ---- generación de enemigos
  let spawnRooms = roomsByDist.filter(r => r !== map.startRoom); if (!spawnRooms.length) spawnRooms = roomsByDist;
  for (let k = 0; k < M.guards; k++) {
    const room = spawnRooms[(k * 7 + 3) % spawnRooms.length]; const c = freeCell(room, { minStart: 8 }) || freeCell(room); if (!c) continue;
    const other = spawnRooms[(k * 5 + 1 + (R() * 3 | 0)) % spawnRooms.length];
    let path = findPath(map, c[0], c[1], other.cx, other.cy) || [];
    if (path.length > 40) path = path.slice(0, 40);
    const wp = [cellCenter(c[0], c[1])]; for (let s = 3; s < path.length; s += 3) wp.push(cellCenter(path[s].x, path[s].y)); if (path.length) wp.push(cellCenter(path[path.length - 1].x, path[path.length - 1].y));
    level.guardsSpawn.push({ ...cellCenter(c[0], c[1]), wp, sentry: R() < 0.25 || wp.length < 2 });
  }
  const infTotal = [['infected', M.infected], ['runner', M.runners], ['brute', M.brutes]];
  infTotal.forEach(([kind, n]) => {
    for (let k = 0; k < n; k++) {
      const room = spawnRooms[(R() * spawnRooms.length) | 0]; const c = freeCell(room, { minStart: kind === 'brute' ? 12 : 9 }); if (!c) continue; occ.add(key(c[0], c[1]));
      level.infSpawn.push({ kind, ...cellCenter(c[0], c[1]) });
    }
  });
  // escolta / supervivencia
  level.startPos = cellCenter(map.start.x, map.start.y);
  level.arenaCenter = cellCenter(W >> 1, H >> 1);

  // pickups 3D
  level.pickups.forEach(p => { p.mesh = makePickup(p.type); p.mesh.position.set(p.x, 0, p.z); G.add(p.mesh); const gl = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.6), new THREE.MeshBasicMaterial({ map: poolTex, color: new THREE.Color(p.mesh.userData.col).multiplyScalar(0.5), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); gl.rotation.x = -Math.PI / 2; gl.position.y = 0.025; p.mesh.add(gl); });
  // fondo exterior: siluetas de acantilado más allá del borde
  if (th.outdoor) {
    const rm = mats().rock;
    for (let k = 0; k < 40; k++) {
      const side = k % 4; let x, z;
      if (side === 0) { x = R() * W * CS; z = -3 - R() * 6; } else if (side === 1) { x = R() * W * CS; z = H * CS + 3 + R() * 6; } else if (side === 2) { x = -3 - R() * 6; z = R() * H * CS; } else { x = W * CS + 3 + R() * 6; z = R() * H * CS; }
      const geo = new THREE.IcosahedronGeometry(2 + R() * 3, 1); const m = new THREE.Mesh(geo, rm); m.position.set(x, R() * 1.5, z); m.rotation.set(R() * 6, R() * 6, R() * 6); m.castShadow = false; m.receiveShadow = true; G.add(m);
    }
  }
  return level;
}

function makeExitMarker() {
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.1, 1.35, 48), new THREE.MeshBasicMaterial({ color: new THREE.Color(0x50ff9a).multiplyScalar(2.5), transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.04; g.add(ring);
  const beamMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uCol: { value: new THREE.Color(0x50ff9a) }, uT: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 uCol; uniform float uT; varying vec2 vUv; void main(){ float a=(1.0-vUv.y)*0.55*(0.75+0.25*sin(vUv.y*30.0-uT*4.0)); gl_FragColor=vec4(uCol*1.6,a); }',
  });
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.2, 7, 32, 1, true), beamMat); beam.position.y = 3.5; g.add(beam);
  g.userData = { ring, beam, beamMat };
  return g;
}

function makeFire() {
  const g = new THREE.Group();
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uT: { value: Math.random() * 10 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `uniform float uT; varying vec2 vUv;
      float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
      void main(){ vec2 uv=vUv; float t=uT; float f=n(vec2(uv.x*4.0,uv.y*3.0-t*2.5))*0.6+n(vec2(uv.x*9.0,uv.y*7.0-t*4.0))*0.4;
        float shape=(1.0-uv.y)*smoothstep(0.5,0.0,abs(uv.x-0.5)*(1.2-uv.y*0.6)); float a=smoothstep(0.25,0.7,f*shape*1.6);
        vec3 c=mix(vec3(1.0,0.25,0.02),vec3(1.0,0.85,0.4),smoothstep(0.4,1.0,f*shape*1.8))*3.0; gl_FragColor=vec4(c,a); }`,
  });
  for (let k = 0; k < 3; k++) { const p = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 2.4), mat); p.position.y = 1.15; p.rotation.y = k * Math.PI / 3; g.add(p); }
  g.add(box(1.2, 0.3, 1, mats().dark, 0, 0.15, 0));
  g.userData.mat = mat; return g;
}

// recorte en tramado de muros entre cámara y jugadora
const CUT = { uPlayer: { value: new THREE.Vector3() } };
function addCutaway(mat) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uPlayer = CUT.uPlayer;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvec4 _wp=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\n_wp=instanceMatrix*_wp;\n#endif\nvWP=(modelMatrix*_wp).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP; uniform vec3 uPlayer;')
      .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
      { vec2 d = vWP.xz - uPlayer.xz; float r = length(vec2(d.x*0.8, d.y));
        if (vWP.z > uPlayer.z + 0.2 && r < 5.0 && vWP.y > 0.5) {
          float k = smoothstep(5.0, 2.2, r);
          float dth = fract(sin(dot(floor(gl_FragCoord.xy), vec2(12.9898,78.233)))*43758.5453);
          if (dth < k*0.92) discard;
        } }`);
  };
  mat.customProgramCacheKey = () => 'cutaway';
}

const RIGMAT = {};
function rmat(key, c, r = 0.75, m = 0, e, ei = 0) {
  if (RIGMAT[key]) return RIGMAT[key];

}

function makeHumanoid(o) {
  const R = rng(o.seed || 1);
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const cap = (r, l, m) => { const x = new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 4, 12), m); x.castShadow = true; x.receiveShadow = true; return x; };

  const sph = (r, m, ws = 14) => { const x = new THREE.Mesh(new THREE.SphereGeometry(r, ws, ws * 0.75 | 0), m); x.castShadow = true; return x; };

  if (o.pouches) { for (let k = -1; k <= 1; k++) { const p = bx(0.12, 0.12, 0.08, o.pouches); p.position.set(k * 0.13, 0.22, 0.2); torso.add(p); } const bp = bx(0.34, 0.4, 0.14, o.pouches); bp.position.set(0, 0.42, -0.22); torso.add(bp); }
  const neck = cap(0.07, 0.08, skin); neck.position.y = 0.68; torso.add(neck);
  const head = new THREE.Group(); head.position.y = 0.84; torso.add(head);
  const skull = sph(0.155, skin); skull.scale.set(0.95, 1.08, 1); head.add(skull);
  switch (o.headgear) {
    case 'mask': { // casco + máscara de gas con lentes rojas
      const helm = sph(0.175, rmat('helm', 0x2a2e2a, 0.6, 0.3)); helm.scale.set(1.05, 0.8, 1.1); helm.position.y = 0.06; head.add(helm);
      const mask = bx(0.24, 0.16, 0.12, rmat('mask', 0x15181a, 0.5)); mask.position.set(0, -0.03, 0.12); head.add(mask);
      const lensM = rmat('lens', 0x200000, 0.2, 0, 0xff2a1a, 5);

      const can = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.1, 10), rmat('can', 0x3a3f36, 0.6)); can.rotation.x = Math.PI / 2; can.position.set(0, -0.09, 0.2); head.add(can);
      break; }
    case 'agent': { // capucha táctica + visor de filtro con luz azul
      const hood = sph(0.168, suit); hood.scale.set(1, 1.05, 1.05); hood.position.set(0, 0.01, -0.012); head.add(hood);
      const vis = bx(0.22, 0.07, 0.06, rmat('visor', 0x050a10, 0.1, 0.5, 0x3aa0ff, 2.2)); vis.position.set(0, 0.03, 0.14); head.add(vis);
      const mask = bx(0.18, 0.1, 0.08, rmat('amask', 0x101418, 0.5)); mask.position.set(0, -0.07, 0.13); head.add(mask);
      const hair = cap(0.045, 0.2, rmat('hair', 0x14100c, 0.9)); hair.position.set(0, -0.05, -0.17); hair.rotation.x = 0.4; head.add(hair);
      break; }
    case 'glasses': { const gl = bx(0.2, 0.04, 0.03, rmat('gls', 0x88aacc, 0.1, 0.5, 0x88aacc, 0.4)); gl.position.set(0, 0.03, 0.15); head.add(gl); const hair = sph(0.16, rmat('ghair', 0x9a9a92, 0.9)); hair.scale.set(1, 0.6, 1); hair.position.set(0, 0.08, -0.02); head.add(hair); break; }
    case 'bare': default: { const hair = sph(0.158, rmat('dhair', 0x1a1612, 0.95)); hair.scale.set(1, 0.7, 1.02); hair.position.set(0, 0.05, -0.02); head.add(hair); }
  }
  const mkLimb = (side, upper, lower, r, mU, mL, y, x) => {
    const pivot = new THREE.Group(); pivot.position.set(x * side, y, 0);
    const u = cap(r, upper, mU); u.position.y = -upper / 2 - r * 0.5; pivot.add(u);
    const joint = new THREE.Group(); joint.position.y = -upper - r; pivot.add(joint);
    const l = cap(r * 0.88, lower, mL); l.position.y = -lower / 2 - r * 0.5; joint.add(l);
    return { pivot, joint };
  };
  const legL = mkLimb(-1, 0.36, 0.36, 0.085, suit, suit, -0.02, 0.11), legR = mkLimb(1, 0.36, 0.36, 0.085, suit, suit, -0.02, 0.11);
  [legL, legR].forEach(L => { hips.add(L.pivot); const boot = bx(0.13, 0.1, 0.26, rmat('boot', 0x101010, 0.6)); boot.position.set(0, -0.48, 0.05); L.joint.add(boot); });
  const armL = mkLimb(-1, 0.28, 0.26, 0.068, suit, o.forearm || suit, 0.6, 0.31), armR = mkLimb(1, 0.28, 0.26, 0.068, suit, o.forearm || suit, 0.6, 0.31);
  [armL, armR].forEach(A => { torso.add(A.pivot); const hand = sph(0.06, o.hand || skin, 8); hand.position.y = -0.38; A.joint.add(hand); });
  if (o.gun) { const gun = new THREE.Group(); const gm = rmat('gun', 0x111214, 0.4, 0.6); const b = bx(0.06, 0.1, o.gun === 'rifle' ? 0.7 : 0.26, gm); b.position.z = o.gun === 'rifle' ? 0.2 : 0.08; gun.add(b); if (o.gun === 'pistol') { const s = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.18, 8), gm); s.rotation.x = Math.PI / 2; s.position.z = 0.28; gun.add(s); } gun.position.set(0, -0.4, 0.04); armR.joint.add(gun); g.userData.gun = gun; }
  if (o.nodules) {

    for (let k = 0; k < o.nodules; k++) {
      const s = sph(0.03 + R() * 0.05 * (o.nodSize || 1), nm, 8);
      const where = R(); let parent = torso;

      else if (where < 0.85) { parent = (R() < 0.5 ? armL : armR).pivot; s.position.set((R() - 0.5) * 0.12, -0.1 - R() * 0.2, (R() - 0.5) * 0.12); }
      else { parent = (R() < 0.5 ? legL : legR).pivot; s.position.set((R() - 0.5) * 0.15, -0.1 - R() * 0.25, (R() - 0.5) * 0.15); }
      parent.add(s);
    }
  }
  if (o.coat) { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.36, 0.7, 12, 1, true), o.coat); c.position.y = -0.18; c.castShadow = true; c.material.side = THREE.DoubleSide; hips.add(c); }
  g.scale.setScalar(o.scale || 1);
  return { g, body, hips, torso, head, legL, legR, armL, armR, phase: R() * 6, hunch: o.hunch || 0, fall: 0 };
}

// pose: 'walk' (amt 0..1), 'aim', 'crouch', 'reach' (infectados)
function animRig(r, dt, speed, opts = {}) {
  const amt = Math.min(1, speed / 3.5);
  r.phase += dt * (3 + speed * 2.2) * (opts.rate || 1);
  const s = Math.sin(r.phase), c = Math.cos(r.phase);
  const crouch = opts.crouch ? 1 : 0;
  r.crouchK = (r.crouchK || 0) + (crouch - (r.crouchK || 0)) * Math.min(1, dt * 10);
  const ck = r.crouchK;
  r.hips.position.y = 0.95 - ck * 0.32 + Math.abs(c) * 0.05 * amt;
  r.torso.rotation.x = r.hunch + ck * 0.35 + amt * 0.08;
  r.legL.pivot.rotation.x = s * 0.75 * amt - ck * 0.9; r.legR.pivot.rotation.x = -s * 0.75 * amt - ck * 0.9;
  r.legL.joint.rotation.x = Math.max(0, -c) * 1.0 * amt + ck * 1.5; r.legR.joint.rotation.x = Math.max(0, c) * 1.0 * amt + ck * 1.5;
  if (opts.reach) { // brazos hacia delante, temblor
    const j = Math.sin(r.phase * 3.1) * 0.12;
    r.armL.pivot.rotation.x = -1.25 + j; r.armR.pivot.rotation.x = -1.35 - j; r.armL.pivot.rotation.z = 0.15; r.armR.pivot.rotation.z = -0.15;
    r.armL.joint.rotation.x = -0.3; r.armR.joint.rotation.x = -0.2;
    r.head.rotation.z = Math.sin(r.phase * 0.7) * 0.25; r.head.rotation.x = 0.2;
  } else if (opts.aim) {
    r.armR.pivot.rotation.x = -1.5; r.armR.joint.rotation.x = -0.05; r.armR.pivot.rotation.z = 0.05;
    r.armL.pivot.rotation.x = -1.3; r.armL.pivot.rotation.z = -0.55; r.armL.joint.rotation.x = -0.4;
    r.head.rotation.set(0, 0, 0);
  } else {
    r.armL.pivot.rotation.x = -s * 0.6 * amt; r.armR.pivot.rotation.x = s * 0.6 * amt; r.armL.pivot.rotation.z = 0.08; r.armR.pivot.rotation.z = -0.08;
    r.armL.joint.rotation.x = -0.3 - amt * 0.3; r.armR.joint.rotation.x = -0.3 - amt * 0.3;
    r.head.rotation.set(0, 0, 0);
  }
  if (opts.recoil) { r.armR.pivot.rotation.x -= opts.recoil * 0.4; r.torso.rotation.x -= opts.recoil * 0.06; }
}

function animDeath(r, dt) {
  r.fall = Math.min(1, r.fall + dt * 2.2);
  const k = 1 - Math.pow(1 - r.fall, 3);
  r.body.rotation.x = -k * Math.PI / 2 * 0.98; r.body.position.y = k * 0.18; r.body.position.z = -k * 0.4;
  r.armL.pivot.rotation.x = -k * 2.6; r.armR.pivot.rotation.x = -k * 2.4;
  r.legL.pivot.rotation.x = 0; r.legR.pivot.rotation.x = k * 0.3; r.legL.joint.rotation.x = 0; r.legR.joint.rotation.x = k * 0.4;
}

const PART = (() => {
  const N = 1800, geo = new THREE.BufferGeometry(), pos = new Float32Array(N * 3), seed = new Float32Array(N);
  for (let i = 0; i < N; i++) { pos[i * 3] = Math.random() * 44 - 22; pos[i * 3 + 1] = Math.random() * 12; pos[i * 3 + 2] = Math.random() * 36 - 18; seed[i] = Math.random(); }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('seed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uCol: { value: new THREE.Color(1, 1, 1) }, uSize: { value: 1 }, uOp: { value: 0.6 }, uT: { value: 0 } },
    vertexShader: 'attribute float seed; uniform float uSize,uT; varying float vS; void main(){ vS=seed; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=uSize*(0.5+seed)*(320.0/-mv.z); gl_Position=projectionMatrix*mv; }',
    fragmentShader: 'uniform vec3 uCol; uniform float uOp,uT; varying float vS; void main(){ vec2 c=gl_PointCoord-0.5; float a=smoothstep(0.5,0.0,length(c)); a*=uOp*(0.6+0.4*sin(uT*3.0+vS*40.0)); gl_FragColor=vec4(uCol,a); }',
  });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; scene.add(pts);
  let mode = 'snow';
  return {
    set(m) {
      mode = m; pts.visible = m !== 'none';
      const cfg = { snow: [0xdfe8ff, 0.55, 0.6], spores: [0xff8a2a, 0.5, 0.75], embers: [0xff7a20, 0.45, 0.95], dust: [0xbfc8d0, 0.4, 0.2] }[m] || [0xffffff, 1, 0.5];
      mat.uniforms.uCol.value.set(cfg[0]); mat.uniforms.uSize.value = cfg[1]; mat.uniforms.uOp.value = cfg[2];
      geo.setDrawRange(0, m === 'snow' ? N : m === 'dust' ? 600 : 550);
    },
    update(dt, cx, cz, t) {
      mat.uniforms.uT.value = t;
      for (let i = 0; i < N; i++) {
        const k = i * 3, s = seed[i];
        if (mode === 'snow') { pos[k + 1] -= dt * (1.2 + s * 1.2); pos[k] += dt * (Math.sin(t * 0.7 + s * 30) * 0.8 + 0.9); }
        else if (mode === 'embers') { pos[k + 1] += dt * (0.8 + s * 1.5); pos[k] += Math.sin(t * 2 + s * 50) * dt * 0.8; }
        else { pos[k + 1] += Math.sin(t * 0.5 + s * 20) * dt * 0.15; pos[k] += Math.cos(t * 0.3 + s * 10) * dt * 0.2; pos[k + 2] += Math.sin(t * 0.4 + s * 7) * dt * 0.2; }
        if (pos[k + 1] < 0) pos[k + 1] += 9; if (pos[k + 1] > 9) pos[k + 1] -= 9;
        let dx = pos[k] - cx; if (dx > 22) pos[k] -= 44; else if (dx < -22) pos[k] += 44;
        let dz = pos[k + 2] - cz; if (dz > 18) pos[k + 2] -= 36; else if (dz < -18) pos[k + 2] += 36;
      }
      geo.attributes.position.needsUpdate = true;
    },
  };
})();

function fxExplosion(x, z, scale = 1) {

function updFX(dt) {
  for (let i = FX.length - 1; i >= 0; i--) {
    const f = FX[i]; f.t -= dt; const k = Math.max(0, f.t / f.life);
    if (f.kind === 'fade') f.m.material.opacity = k;
    else if (f.kind === 'ring') { const s = f.r * (1 - k * k); f.m.scale.set(s, s, s); f.m.material.opacity = k * 0.8; }
    else if (f.kind === 'spark') { f.v.y -= 12 * dt; f.m.position.addScaledVector(f.v, dt); if (f.m.position.y < 0.05) { f.m.position.y = 0.05; f.v.multiplyScalar(0.3); } f.m.material.opacity = k; }
    else if (f.kind === 'boom') { const s = f.s * (1 - k * k * k) + 0.3; f.m.scale.set(s, s * 0.7, s); f.m.material.opacity = k; }
    if (f.t <= 0) { scene.remove(f.m); if (f.m.geometry !== tracerGeo && f.m.geometry !== ringGeo && f.m.geometry !== sparkGeo) f.m.geometry.dispose(); f.m.material.dispose(); FX.splice(i, 1); }

      <kbd>E (mantener)</kbd><span>Interactuar con objetivos</span><kbd>R</kbd><span>Recargar</span>
      <kbd>Q · 1 · 2</kbd><span>Cambiar de arma</span><kbd>H</kbd><span>Usar botiquín (+45)</span>
      <kbd>F</kbd><span>Linterna: ver mejor o pasar desapercibida</span><kbd>Esc / P</kbd><span>Pausa</span>
    </div>
    <p class="hint">Los guardias ven en un cono y oyen disparos y carreras. Los infectados oyen todo y ven poco, pero la linterna los atrae. Los anillos en el suelo muestran cuánto ruido haces.</p>
    <div class="btnrow"><button class="btn" id="bBack">Volver</button></div></div>`);
  $('bBack').onclick = () => { SFX.ui(); back(); }; $('bBack').focus();
}
function showSelect() {
  const items = MISSIONS.map((m, i) => `<button data-i="${i}" ${i + 1 > SAVE.unlocked ? 'disabled' : ''}><span>MISIÓN ${String(m.id).padStart(2, '0')}${SAVE.ranks[m.id] ? ' · RANGO ' + SAVE.ranks[m.id] : ''}</span>${m.title}</button>`).join('');
  screen(`<div class="card"><div class="eyebrow">Expediente de operación</div><h2>Misiones</h2><div class="grid20">${items}</div><div class="btnrow"><button class="btn ghost" id="bBack">Volver</button></div></div>`);
  UI.querySelectorAll('.grid20 button').forEach(b => b.onclick = () => { SFX.ui(); showBriefing(+b.dataset.i); });
  $('bBack').onclick = () => { SFX.ui(); showTitle(); };
}
function showPrologue() {
  const el = screen(`<div class="card" style="width:min(760px,100%)"><div class="eyebrow">Prólogo</div><h2>Isla Sólveig</h2><div class="prose" id="pr"></div><div class="btnrow"><button class="btn" id="bGo">Iniciar operación</button></div></div>`);
  const pr = $('pr'); PROLOGUE.forEach((p, i) => { const e = document.createElement('p'); e.textContent = p; e.style.animationDelay = (i * 0.9) + 's'; pr.appendChild(e); });
  $('bGo').onclick = () => { SFX.ui(); showBriefing(0); }; $('bGo').focus();
}

function radioSequence(container, lines, done) {
  let i = 0, typing = null, full = '';
  const next = () => {
    if (typing) { clearInterval(typing); typing = null; container.lastChild.querySelector('.txt').textContent = full; return; }
    if (i >= lines.length) { done(); return; }
    const [sp, text] = lines[i++]; full = text;
    const wrap = document.createElement('div'); wrap.innerHTML = lineHTML(sp, ''); const el = wrap.firstChild; container.appendChild(el);
    while (container.children.length > 3) container.removeChild(container.firstChild);
    const tx = el.querySelector('.txt'); let k = 0; SFX.radio();
    typing = setInterval(() => { k += 2; tx.textContent = text.slice(0, k); if (k % 8 === 0) SFX.blip(); if (k >= text.length) { clearInterval(typing); typing = null; } }, 22);
  };
  next();
  return next;
}

function showBriefing(idx) {
  G.mode = 'brief'; setHUD(false);
  loadMission(idx, true); SFX.ambient(MISSIONS[idx].theme); SFX.setMusic(0);
  const M = MISSIONS[idx];
  const el = screen(`<div class="card"><div class="eyebrow">Misión ${String(M.id).padStart(2, '0')} / 20 · Enlace de radio</div><h2>${M.title}</h2>
    <div class="meta"><span>Lugar <b>${M.place}</b></span><span>Hora <b>${M.time}</b></span>${SAVE.ranks[M.id] ? `<span>Mejor rango <b>${SAVE.ranks[M.id]}</b></span>` : ''}</div>
    <div class="radio" id="rad"></div><div class="hint" id="rh">Clic, Espacio o Intro para continuar</div>
    <div id="objs" hidden></div>
    <div class="btnrow"><button class="btn" id="bStart" hidden>Iniciar misión</button><button class="btn ghost" id="bSkip">Saltar diálogo</button><button class="btn ghost" id="bMenu">Menú</button></div></div>`);
  const showObjs = () => {
    const o = $('objs'); if (!o) return; o.hidden = false; o.className = 'objs'; o.innerHTML = '<div class="eyebrow" style="margin-bottom:6px">Objetivos</div>' + M.objectives.map(x => `<div>${x.label}</div>`).join('');
    $('bStart').hidden = false; $('bSkip').hidden = true; $('rh').hidden = true; $('bStart').focus(); G.briefNext = null;
  };
  G.briefNext = radioSequence($('rad'), M.intro, showObjs);
  el.querySelector('.card').addEventListener('click', (e) => { if (e.target.tagName !== 'BUTTON' && G.briefNext) G.briefNext(); });
  $('bSkip').onclick = () => { SFX.ui(); const r = $('rad'); r.innerHTML = ''; M.intro.slice(-2).forEach(l => r.insertAdjacentHTML('beforeend', lineHTML(l[0], l[1]))); showObjs(); };
  $('bStart').onclick = () => { SFX.init(); SFX.ui(); startMission(idx); };
  $('bMenu').onclick = () => { SFX.ui(); showTitle(); };
}

function startMission(idx) {
  fade(() => {
    loadMission(idx, false); hideScreen(); G.mode = 'play'; G.paused = false; G.hintDone = false; hudCache = {};
    buildRadarMap(); setHUD(true); updHUDObjective(); toast(`${String(G.M.id).padStart(2, '0')} · ${G.M.title.toUpperCase()}`);
    SFX.setMusic(G.M.boss || G.M.survive || G.M.escape ? 2 : 0);
  });
}
function fade(fn) { const f = $('fade'); f.classList.add('on'); setTimeout(() => { fn(); setTimeout(() => f.classList.remove('on'), 80); }, 550); }

function rankOf() {
  const M = G.M, s = G.stats; const par = 100 + M.objectives.length * 55 + (M.w * M.h) / 20;
  let sc = 100 - s.alerts * 14 - Math.min(30, s.damage / 4) - Math.max(0, (G.time - par) / 8) - s.kills * 3 - s.takedowns * 0.5;
  if (M.survive || M.boss || M.escape) sc = 100 - Math.min(45, s.damage / 3) - (M.escape ? Math.max(0, (M.escape - G.escT - 120) / 3) : 0);
  const r = sc >= 88 ? 'S' : sc >= 72 ? 'A' : sc >= 55 ? 'B' : sc >= 35 ? 'C' : 'D';
  const names = { S: 'Fantasma', A: 'Sombra', B: 'Operativa', C: 'Ruidosa', D: 'Superviviente' };
  return [r, names[r]];
}
function missionComplete() {
  if (G.done) return; G.done = true; SFX.objective(); SFX.setMusic(0);
  const [r, rn] = rankOf(); const M = G.M;
  const order = ['D', 'C', 'B', 'A', 'S'];
  if (!SAVE.ranks[M.id] || order.indexOf(r) > order.indexOf(SAVE.ranks[M.id])) SAVE.ranks[M.id] = r;
  SAVE.unlocked = Math.max(SAVE.unlocked, Math.min(20, M.id + 1)); save();
  setTimeout(() => {
    G.mode = 'debrief'; setHUD(false);
    const s = G.stats; const mm = Math.floor(G.time / 60), ss = Math.floor(G.time % 60);
    screen(`<div class="card"><div class="eyebrow">Misión ${String(M.id).padStart(2, '0')} completada</div><h2>${M.title}</h2>
      <div class="radio" id="rad"></div><div class="hint" id="rh">Clic, Espacio o Intro para continuar</div>
      <div id="res" hidden>
        <div class="rank"><div class="r">${r}</div><div class="n">RANGO<b>${rn}</b></div></div>
        <div class="stats"><div><span>Tiempo</span><b>${mm}:${String(ss).padStart(2, '0')}</b></div><div><span>Alertas</span><b>${s.alerts}</b></div><div><span>Guardias abatidos</span><b>${s.kills}</b></div><div><span>Neutralizaciones CQC</span><b>${s.takedowns}</b></div><div><span>Infectados</span><b>${s.infKills}</b></div><div><span>Daño recibido</span><b>${Math.round(s.damage)}</b></div><div><span>Documentos</span><b>${s.docs}/${(M.docs || []).length}</b></div></div>
      </div>
      <div class="btnrow" id="dbtn" hidden>${M.id < 20 ? '<button class="btn" id="bNext">Siguiente misión</button>' : '<button class="btn" id="bEnd">Epílogo</button>'}<button class="btn ghost" id="bRe">Repetir</button><button class="btn ghost" id="bMenu">Menú</button></div></div>`);
    const fin = () => { $('res').hidden = false; $('dbtn').hidden = false; $('rh').hidden = true; G.briefNext = null; const b = $('bNext') || $('bEnd'); b.focus(); };
    G.briefNext = radioSequence($('rad'), M.outro, fin);
    UI.querySelector('.card').addEventListener('click', (e) => { if (e.target.tagName !== 'BUTTON' && G.briefNext) G.briefNext(); });
    if ($('bNext')) $('bNext').onclick = () => { SFX.ui(); showBriefing(M.id); };
    if ($('bEnd')) $('bEnd').onclick = () => { SFX.ui(); showEpilogue(); };
    $('bRe').onclick = () => { SFX.ui(); showBriefing(M.id - 1); };
    $('bMenu').onclick = () => { SFX.ui(); showTitle(); };
  }, 1200);
}
function fail(reason) {
  if (G.done) return; G.done = true; SFX.setMusic(0);
  setTimeout(() => {
    G.mode = 'dead'; setHUD(false);
    screen(`<div class="card" style="width:min(560px,100%)"><div class="eyebrow red">Señal perdida</div><h2 class="red">Misión fallida</h2><p class="prose">${reason}</p>
      <p class="hint">Ibarra: «Sílex, ¿me recibes? Repite la aproximación».</p>
      <div class="btnrow"><button class="btn" id="bRe">Reintentar</button><button class="btn ghost" id="bBr">Ver informe</button><button class="btn ghost" id="bMenu">Menú</button></div></div>`);
    $('bRe').onclick = () => { SFX.ui(); startMission(G.idx); }; $('bRe').focus();
    $('bBr').onclick = () => { SFX.ui(); showBriefing(G.idx); };
    $('bMenu').onclick = () => { SFX.ui(); showTitle(); };
  }, 900);
}
function showEpilogue() {
  G.mode = 'brief'; setHUD(false);
  const el = screen(`<div class="card" style="width:min(780px,100%)"><div class="eyebrow">Epílogo</div><h2>Ceniza</h2><div class="prose" id="pr"></div>
    <p class="hint" style="margin-top:18px">PROTOCOLO CENIZA · Una historia original de infiltración y supervivencia.</p>
    <div class="btnrow"><button class="btn" id="bT">Volver al inicio</button><button class="btn ghost" id="bS">Seleccionar misión</button></div></div>`);
  const pr = $('pr'); EPILOGUE.forEach((p, i) => { const e = document.createElement('p'); e.textContent = p; e.style.animationDelay = (i * 1.1) + 's'; pr.appendChild(e); });
  $('bT').onclick = () => { SFX.ui(); showTitle(); }; $('bS').onclick = () => { SFX.ui(); showSelect(); };
}
function openDoc(doc) {
  G.paused = true; G.uiBlock = true; mouse.left = false;
  const el = screen(`<div class="doc"><h3>${doc.title}</h3><pre></pre><button class="btn" id="bClose">Guardar y continuar</button></div>`);
  el.querySelector('pre').textContent = doc.body; $('cursor').hidden = true; canvas.style.cursor = 'default';
  const close = () => { SFX.ui(); hideScreen(); G.paused = false; setTimeout(() => G.uiBlock = false, 150); $('cursor').hidden = touch.on; canvas.style.cursor = 'none'; if (G.M.docRadio && !G.docRadioDone) { G.docRadioDone = true; G.M.docRadio.forEach(l => subLine(l[0], null, l[1])); } G.closeDoc = null; };
  $('bClose').onclick = close; G.closeDoc = close; $('bClose').focus();
}
function pause() {
  if (G.mode !== 'play' || G.done) return;
  if (G.paused) { if (G.closeDoc) { G.closeDoc(); return; } resume(); return; }
  G.paused = true; mouse.left = false; $('cursor').hidden = true; canvas.style.cursor = 'default';
  const ob = curObj();
  screen(`<div class="card" style="width:min(520px,100%)"><div class="eyebrow">Pausa · Misión ${String(G.M.id).padStart(2, '0')}</div><h2>${G.M.title}</h2>
    <div class="objs"><div>${ob.label}</div></div>
    <div class="menu" style="margin-top:18px;width:100%"><button id="pR">Continuar</button><button id="pRe">Reiniciar misión</button><button id="pK">Controles</button><button id="pM">Abandonar al menú</button></div></div>`);
  $('pR').onclick = resume; $('pRe').onclick = () => { SFX.ui(); startMission(G.idx); }; $('pK').onclick = () => showKeys(() => { G.paused = false; pause(); }); $('pM').onclick = () => { SFX.ui(); showTitle(); };
  $('pR').focus();
}
function resume() { hideScreen(); G.paused = false; $('cursor').hidden = touch.on; canvas.style.cursor = 'none'; }

// ============================================================================
// Entrada
// ============================================================================
addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'Tab'].includes(e.code) && G.mode === 'play') e.preventDefault();
  if ((G.mode === 'brief' || G.mode === 'debrief') && G.briefNext && (e.code === 'Space' || e.code === 'Enter') && !(document.activeElement && document.activeElement.tagName === 'BUTTON' && !document.activeElement.hidden && e.code === 'Enter')) { e.preventDefault(); G.briefNext(); return; }
  if (e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true; SFX.init();
  if (e.code === 'Escape' || e.code === 'KeyP') { pause(); return; }
  if (G.mode !== 'play' || G.paused) return;
  const P = G.player; if (!P || !P.alive) return;
  if (e.code === 'KeyC' || e.code === 'ControlLeft') P.crouch = !P.crouch;
  if (e.code === 'KeyF') { P.lamp = !P.lamp; SFX.ui(); }
  if (e.code === 'KeyR') startReload();
  if (e.code === 'Space') doCQC();
  if (e.code === 'KeyH') { if (P.med > 0 && P.hp < 100) { P.med--; P.hp = Math.min(100, P.hp + 45); SFX.pickup(); subLine('SYS', null, 'Botiquín aplicado'); } }
  if ((e.code === 'KeyQ' || e.code === 'Digit1' || e.code === 'Digit2') && P.hasShotgun) { const w = e.code === 'Digit1' ? 'pistol' : e.code === 'Digit2' ? 'shotgun' : (P.weapon === 'pistol' ? 'shotgun' : 'pistol'); if (w !== P.weapon) { P.weapon = w; P.reloadT = 0; P.fireT = 0.35; SFX.reload(); } }
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.left = mouse.right = false; });
addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; const c = $('cursor'); c.style.left = e.clientX + 'px'; c.style.top = e.clientY + 'px'; });
canvas.addEventListener('mousedown', (e) => { SFX.init(); if (e.button === 0) mouse.left = true; if (e.button === 2) mouse.right = true; });
addEventListener('mouseup', (e) => { if (e.button === 0) mouse.left = false; if (e.button === 2) mouse.right = false; });
addEventListener('contextmenu', (e) => { if (G.mode === 'play') e.preventDefault(); });
addEventListener('wheel', (e) => { if (G.mode === 'play' && !G.paused && G.player && G.player.hasShotgun && Math.abs(e.deltaY) > 20) { G.player.weapon = G.player.weapon === 'pistol' ? 'shotgun' : 'pistol'; G.player.reloadT = 0; SFX.reload(); } }, { passive: true });

// táctil
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  touch.on = matchMedia('(pointer: coarse)').matches;
  const stick = (id, cb) => {
    const el = $(id), knob = el.querySelector('i'); let pid = null, cx = 0, cy = 0;
    el.addEventListener('pointerdown', (e) => { SFX.init(); pid = e.pointerId; el.setPointerCapture(pid); const r = el.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; move(e); });
    const move = (e) => { if (e.pointerId !== pid) return; let dx = (e.clientX - cx) / 55, dy = (e.clientY - cy) / 55; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; } knob.style.transform = `translate(${dx * 38}px,${dy * 38}px)`; cb(dx, dy); };
    el.addEventListener('pointermove', move);
    const up = (e) => { if (e.pointerId !== pid) return; pid = null; knob.style.transform = ''; cb(0, 0); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  };
  stick('stickL', (x, y) => { touch.mx = x; touch.mz = y; });
  stick('stickR', (x, y) => { touch.ax = x; touch.az = y; touch.fire = Math.hypot(x, y) > 0.75; });
  document.querySelectorAll('.tbtns button').forEach(b => {
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); const k = b.dataset.k; if (k === 'KeyE') { touch.act = true; return; } dispatchEvent(new KeyboardEvent('keydown', { code: k })); setTimeout(() => dispatchEvent(new KeyboardEvent('keyup', { code: k })), 60); });
    b.addEventListener('pointerup', () => { if (b.dataset.k === 'KeyE') touch.act = false; });
  });
}

function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  grade.uniforms.uRes.value.set(innerWidth * PR, innerHeight * PR);
}
addEventListener('resize', onResize); onResize();

// arranque
try {
  showTitle();
  $('loading').remove();
  requestAnimationFrame(loop);
} catch (err) { $('loading').textContent = 'ERROR: ' + err.message; console.error(err); }
// gancho de depuración (consola): __PC.start(n) inicia la misión n (1-20)
window.__PC = { G, start: (n) => startMission(n - 1), brief: (n) => showBriefing(n - 1) };

</script>
